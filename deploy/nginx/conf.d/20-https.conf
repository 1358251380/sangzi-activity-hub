# HTTPS 入口（容器 443 → 宿主 8443）
# 自签证书，由 scripts/gen-cert.ps1 / gen-cert.sh 生成到 deploy/nginx/certs/
#
# 注意：证书目录已在 .gitignore 中 —— 私钥绝不入库。
# 首次使用前必须先执行一次证书生成，否则 nginx 会因找不到证书而启动失败。

server {
  listen 443 ssl;
  http2 on;
  server_name _;

  ssl_certificate     /etc/nginx/certs/server.crt;
  ssl_certificate_key /etc/nginx/certs/server.key;

  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 10m;
  ssl_prefer_server_ciphers off;

  # ---- 安全响应头（HSTS 只在 HTTPS 下有意义）----
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  add_header Strict-Transport-Security "max-age=31536000" always;

  include /etc/nginx/snippets/app-locations.conf;
}
