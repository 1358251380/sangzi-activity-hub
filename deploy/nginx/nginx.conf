# =============================================================================
# Nginx 反向代理 —— 生产形态的入口
#
# 职责（应用容器只负责业务，不再直接对外）：
#   1. TLS 终止（443），应用内只说 HTTP
#   2. gzip 压缩（含静态资源 —— 这里压缩不占用 Node 主线程）
#   3. 限流（对 /api/ 生效，保护后端）
#   4. 安全响应头
#   5. 请求体大小上限（应用层 100kb，这里 1m 双保险）
#   6. 为每个请求生成 $request_id 并通过 X-Request-Id 传给应用 → 跨层追踪
#   7. /healthz 由 nginx 自己回答（不依赖后端，供负载均衡/探针使用）
#
# 说明：静态资源目前仍由应用容器返回（应用已有长缓存策略）。
#       「静态直出交给 nginx」需要把 dist 再打一份进镜像，留作后续优化点。
# =============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # 关键：$request_id 是 nginx 为每次请求生成的唯一 ID（32 位十六进制），
  # 我们把它透传给应用，应用的日志里就能看到同一个 reqId —— 一次调用跨两层可追踪。
  log_format json escape=json '{"t":"$time_iso8601","lvl":"INFO","reqId":"$request_id",'
                              '"remote":"$remote_addr","m":"$request_method","p":"$request_uri",'
                              '"s":$status,"bytes":$body_bytes_sent,"rt":$request_time,'
                              '"upstream":"$upstream_addr","ua":"$http_user_agent"}';
  access_log /var/log/nginx/access.log json;

  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  keepalive_timeout 65;
  server_tokens   off;

  # ---- gzip：静态资源与 JSON 都压，且由 nginx 压缩不占 Node 线程 ----
  gzip              on;
  gzip_vary         on;
  gzip_min_length   1024;
  gzip_comp_level   5;
  gzip_proxied      any;
  gzip_types        text/plain text/css text/xml application/json application/javascript
                    application/xml image/svg+xml;

  # ---- 限流：按客户端 IP，20 r/s，突发 40 ----
  limit_req_zone $binary_remote_addr zone=api_zone:10m rate=20r/s;
  limit_req_status 429;

  # ---- 请求体上限 ----
  client_max_body_size 1m;
  client_body_timeout  15s;

  # ---- 上游：应用容器（compose 内网服务名 app）----
  upstream sangzi_app {
    server app:3001;
    keepalive 16;
  }

  include /etc/nginx/conf.d/*.conf;
}
