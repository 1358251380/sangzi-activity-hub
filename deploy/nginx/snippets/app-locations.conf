# 两个 server 块共用的 location 定义（HTTP 与 HTTPS 完全一致，只是端口与证书不同）
# 通过 include 复用，避免复制粘贴导致两边策略漂移。

# nginx 自身健康检查：不碰后端，供容器 HEALTHCHECK / 负载均衡探针使用
location = /healthz {
  access_log off;
  add_header Content-Type text/plain always;
  return 200 "ok\n";
}

# ---- API：限流 + 透传请求标识 ----
location /api/ {
  limit_req zone=api_zone burst=40 nodelay;

  proxy_pass http://sangzi_app;
  proxy_http_version 1.1;
  proxy_set_header Connection "";

  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  # 把 nginx 生成的 request id 传给应用；应用会复用它而不是另生成一个
  proxy_set_header X-Request-Id      $request_id;

  proxy_connect_timeout 5s;
  proxy_send_timeout    30s;
  proxy_read_timeout    30s;
}

# ---- 前端与静态资源 ----
location / {
  proxy_pass http://sangzi_app;
  proxy_http_version 1.1;
  proxy_set_header Connection "";

  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-Id      $request_id;
}
