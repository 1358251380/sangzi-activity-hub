# 一键启动：docker compose -f deploy/docker-compose.yml up -d --build
# 访问：      http://localhost:8080   （HTTPS: https://localhost:8443，自签证书）
#
# 拓扑（生产形态：应用不直接对外，只允许经反代进入）
#
#   浏览器 ──► nginx (8080/8443) ──► app:3001（compose 内网）
#                 │                    │
#              TLS/gzip/限流/安全头    SQLite → 命名卷
#
# 容器加固（两个服务都做了）：
#   read_only           根文件系统只读，进程无法落地恶意文件
#   tmpfs               需要写的目录（/tmp 等）挂内存盘
#   no-new-privileges   禁止通过 setuid 等提权
#   deploy.resources    限制 CPU / 内存，防止单容器耗尽宿主机
#
services:
  app:
    build:
      # 构建上下文是仓库根目录（Dockerfile 需要同时拿到 server/ 和 web/）
      context: ..
      dockerfile: deploy/Dockerfile
    image: sangzi-activity-hub:1.0.0
    container_name: sangzi-app
    # 关键：不发布端口，只在 compose 内网暴露。
    # 这样后端无法从宿主直连，所有流量必须经过 nginx —— 流量入口唯一，
    # 便于统一做 TLS、限流、安全头与审计。
    expose:
      - "3001"
    environment:
      NODE_ENV: production
      PORT: "3001"
      DB_PATH: /app/data/app.db
      LOG_FORMAT: json
      TRUST_PROXY: "1"
      # 应用层限流兜底（反代之外的第二道防线）
      RATE_LIMIT_MAX: "120"
      RATE_LIMIT_WINDOW_MS: "60000"
    volumes:
      # 关键：SQLite 文件必须在卷上。
      # 若挂在容器可写层，容器重建/升级后所有活动和评论都会丢 —— 直接违反
      # 任务书"刷新后数据不丢"的要求在容器场景下的延伸。
      - app-data:/app/data
    # ---- 加固 ----
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    restart: unless-stopped
    healthcheck:
      # 用 readiness 而不是 liveness：数据库不可用时容器应标记 unhealthy
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    container_name: sangzi-gateway
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      # 证书目录（不随镜像发布，由 scripts/gen-cert 生成）
      - ./nginx/certs:/etc/nginx/certs:ro
    # ---- 加固 ----
    read_only: true
    tmpfs:
      # nginx 运行时需要的可写目录
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    depends_on:
      app:
        # 等应用真正就绪（readiness 通过）再启动，避免启动瞬间 502
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  app-data:
    name: sangzi-app-data
