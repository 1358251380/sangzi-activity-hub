# 一键启动：docker compose -f deploy/docker-compose.yml up -d --build
# 访问：      http://localhost:3001
services:
  app:
    build:
      # 构建上下文是仓库根目录（Dockerfile 需要同时拿到 server/ 和 web/）
      context: ..
      dockerfile: deploy/Dockerfile
    image: sangzi-activity-hub:1.0.0
    container_name: sangzi-app
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: "3001"
      DB_PATH: /app/data/app.db
    volumes:
      # 关键：SQLite 文件必须在卷上。
      # 若挂在容器可写层，容器重建/升级后所有活动和评论都会丢 —— 直接违反
      # 任务书"刷新后数据不丢"的要求在容器场景下的延伸。
      - app-data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  app-data:
    name: sangzi-app-data
