name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: 测试与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 安装后端依赖
        run: npm --prefix server ci

      # 注意：脚本是 `node --test`（不带目录参数）。
      # Node 24 下 `node --test test/` 会把 `test/` 当作模块去加载并报 MODULE_NOT_FOUND，
      # 必须依赖自动发现（递归匹配 **/*.test.js，自动跳过 node_modules）。
      - name: 后端测试（6 个文件 / 101 项）
        run: npm --prefix server test

      - name: 安装前端依赖
        run: npm --prefix web ci

      - name: 前端测试（4 个文件 / 63 项）
        run: npm --prefix web test

      - name: 构建前端
        run: npm --prefix web run build
